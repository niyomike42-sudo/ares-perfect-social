{% extends "base.html" %}{% block content %}<div class="card profile"><div class="avatar big">{{user.username[:1]|upper}}</div><h1>{{user.username}}</h1><p>{{user.bio}}</p><p>{{posts|length}} posts</p>{% if user.id!=me.id %}<a class="primary inline" href="/messages?to={{user.id}}">Message</a>{% endif %}</div><div class="postgrid">{% for p in posts %}<div class="card">{% if p.image %}<img class="gridimage" src="{{url_for('static',filename=p.image)}}">{% endif %}<p>{{p.caption}}</p></div>{% endfor %}</div>{% endblock %}
